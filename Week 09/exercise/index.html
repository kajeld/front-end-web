<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Some questions for you!</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <h1>Some Questions For You!</h1>
  <p>Please answer honestly. Or don't.</p>

  <section>
    <h2>1. What color is the sky?</h2>
    <button id="blue">Blue</button>
    <button id="green">Green</button>
    <button id="red">Red</button>
    <button id="orange">Orange</button>

    <h3 id="title">Your diagnosis awaits...</h3>
    <p id="message">Think about it.</p>
  </section>

  <section>
    <h2>2. If a worm offered you a tiny hat, what would you do?</h2>
    <button id="accept">Accept it kindly</button>
    <button id="refuse">Politely decline</button>
    <button id="eat">Eat the hat</button>

    <h3 id="title2"></h3>
    <p id="message2"></p>
  </section>

  <section>
    <h2>3. The moon is calling you. Do you answer?</h2>
    <button id="yes">Yes</button>
    <button id="no">No</button>
    <button id="voicemail">Send to voicemail</button>

    <h3 id="title3"></h3>
    <p id="message3"></p>
  </section>

  <button id="reset">Reset Everything</button>

</body>
</html>
