<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cameron Winter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Opening Gate Animation -->
    <div class="intro">
        <img src="assets/Gate_Animation.gif" alt="Opening gate animation">
    </div>

    <main class="homepage">

<!-- homepage -->
<main class="homepage">

    <!-- header -->
    <header class="home-header">

        <!-- CAMERON WINTER TITLE -->
        <h1 class="home-title">
            <span class="title-cameron">Cameron</span>
            <span class="title-winter">Winter</span>
        </h1>

        <!-- hamburger icon -->
        <button class="hamburger" type="button"
                aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>


    <!-- window + illustration -->
    <section class="window-section">

        <!-- panels behind windows bc png is transparent -->
        <div class="window-backgrounds">
            <div class="window-panel"></div>
            <div class="window-panel"></div>
            <div class="window-panel"></div>
        </div>

        <!-- window drawing png-->
        <img src="assets/window.png"
             class="window-drawing"
             alt="Decorative gothic window">


        
<!-- clickable illustration -->
<div class="window-links">

    <!-- owl -->
    <a href="dreams.html" class="owl-link">
        <img src="assets/owl.png"
             class="window-art owl-art"
             alt="Owl illustration">
        <span class="hover-title">Dreams</span>
    </a>

    <!-- cw portrait -->
    <a href="https://cameronwinter.lnk.to/LiveatCarnegieHall"
       target="_blank" class="portrait-link">
        <img src="assets/portrait.png"
             class="window-art portrait-art"
             alt="Cameron Winter portrait">
        <span class="hover-title">Listen</span>
    </a>

    <!-- piano hands -->
    <a href="in-the-world.html" class="piano-link">
        <img src="assets/piano.png"
             class="window-art piano-art"
             alt="Hands playing piano">
        <span class="hover-title">In the World</span>
    </a>

</div>


    </section>


    <!-- scroll down for email -->
    <a href="#signup" class="scroll-text">
        Sign up below ↓
    </a>

</main>


<!-- email sign up section -->
<footer id="signup" class="signup-section">

    <h2>Join the Guestbook</h2>

    <p>Sign up for news and occasional signs of life.</p>

    <!-- email form -- doesn't actually function-->
    <form class="email-form">

        <label for="email">Email Address</label>

        <div class="email-box">
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Your email address"
                required>

            <button type="submit" aria-label="Submit email">
                →
            </button>
        </div>

    </form>

</footer>

    </main>

</body>
</html>
