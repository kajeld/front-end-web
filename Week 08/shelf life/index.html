
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>shelf life</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main>

        <header>

            <section class="details">
                <p id="location"></p>
                <p id="year"></p>
            </section>

            <h1>shelf life</h1>

        </header>


        <section class="collection">

            <button id="previous">←</button>

            <section class="object">

                <section id="display">

                    <img id="object-image" src="" alt="">

                    <section id="story">
                        <h2 id="story-title"></h2>
                        <p id="story-text"></p>
                    </section>

                </section>

                <h2 id="object-name"></h2>

                <p id="counter"></p>

                <p class="instruction">click the object to see its story</p>

            </section>

            <button id="next">→</button>

        </section>

    </main>

</body>
</html>
